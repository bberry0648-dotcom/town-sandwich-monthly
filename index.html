<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>타운샌드위치 월간 인사이트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#f3f4ee; --paper:#ffffff; --ink:#1c211d; --muted:#5d665e; --faint:#8a928a; --line:#dcdfd5;
  --basil:#2f5d3a; --basil-bg:#e2ebe0; --crust:#9c5716; --crust-bg:#f5e7d6; --sky:#2d5670; --sky-bg:#e0e9ef;
  --display:"Hahmlet","Nanum Myeongjo",serif;
  --sans:"Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --ground:#121512; --paper:#1a1e1a; --ink:#e6eae4; --muted:#a3aba2; --faint:#7c857c; --line:#2d342d;
  --basil:#8fc49c; --basil-bg:#1f3325; --crust:#e3a25e; --crust-bg:#3a2a18; --sky:#9cc3dd; --sky-bg:#1b2b36;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#121512; --paper:#1a1e1a; --ink:#e6eae4; --muted:#a3aba2; --faint:#7c857c; --line:#2d342d;
  --basil:#8fc49c; --basil-bg:#1f3325; --crust:#e3a25e; --crust-bg:#3a2a18; --sky:#9cc3dd; --sky-bg:#1b2b36;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:16px/1.75 var(--sans);word-break:keep-all;overflow-wrap:anywhere}
.wrap{max-width:780px;margin:0 auto;padding-inline:16px;padding-block:28px 72px}
a{color:var(--basil);text-underline-offset:3px}
a:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--basil);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;letter-spacing:-.01em}
h1{font-size:34px;line-height:1.25;margin:4px 0 8px;font-weight:700}
h2{font-size:23px;margin:0 0 14px;font-weight:700}
h3{font-size:18px;margin:0 0 6px;font-weight:700}
p{margin:0}
.eyebrow{font-size:13px;letter-spacing:.06em;color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint);font-size:14px}
.chip{display:inline-block;font-size:13px;line-height:1.6;padding:0 9px;border-radius:99px;background:var(--line);color:var(--muted);white-space:nowrap;font-weight:500}
.chip.basil{background:var(--basil-bg);color:var(--basil)} .chip.crust{background:var(--crust-bg);color:var(--crust)} .chip.sky{background:var(--sky-bg);color:var(--sky)}

header.top{display:flex;flex-direction:column;gap:10px;padding-bottom:20px;border-bottom:2px solid var(--ink)}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:14.5px;color:var(--muted)}
.meta b{color:var(--ink);font-weight:500}
.monthpick{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.monthpick select{font:500 15px var(--sans);color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
.note{font-size:14.5px;padding:10px 14px;border-radius:8px;background:var(--crust-bg);color:var(--crust)}

nav.jump{position:sticky;top:env(safe-area-inset-top,0px);z-index:3;background:var(--ground);display:flex;gap:4px 16px;flex-wrap:wrap;padding-block:10px;border-bottom:1px solid var(--line);font-size:14.5px}
nav.jump a{color:var(--muted);text-decoration:none}
nav.jump a:hover{color:var(--basil)}

section{padding-block:34px 6px;display:flex;flex-direction:column;gap:14px;scroll-margin-top:52px}
.lede{color:var(--muted);font-size:15px}

.ideas{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.idea{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.idea .top{display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.idea dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;margin:0;font-size:14.5px}
.idea dt{color:var(--faint)} .idea dd{margin:0}

.obsgroup{display:flex;flex-direction:column;gap:8px}
.obsgroup h3{font-size:17px}
ul.obs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
ul.obs li{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:baseline}
ul.obs .src{font-size:13.5px;color:var(--faint);margin-top:2px}

.cases{display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);border-radius:10px}
.case{display:grid;grid-template-columns:92px 1fr;gap:14px;padding:16px 18px;border-bottom:1px solid var(--line)}
.case:last-child{border-bottom:0}
.case img,.case .noimg{width:92px;height:92px;object-fit:cover;border-radius:6px;background:var(--line);display:block}
.case .head{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.case .head .b{font-weight:700}
.case details{margin-top:6px}
.case summary{cursor:pointer;color:var(--basil);font-size:14.5px}
.four{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin-top:8px;font-size:14.5px}
.four .lb{display:block;font-size:12.5px;letter-spacing:.04em;color:var(--faint)}
.four .fact .lb{color:var(--sky)} .four .apply .lb{color:var(--basil)}

.news{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.news .row{display:grid;grid-template-columns:86px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.news .row .d{font-family:var(--mono);font-size:13.5px;color:var(--faint)}

.topics{display:flex;flex-direction:column;gap:6px}
.topic{display:grid;grid-template-columns:160px 1fr 34px;gap:10px;align-items:center;font-size:14.5px}
.topic .bar{height:10px;border-radius:5px;background:var(--basil);opacity:.85}
.topic .n{text-align:right}

.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.two ul{margin:4px 0 0;padding-left:18px;font-size:15px;display:flex;flex-direction:column;gap:4px}
footer{margin-top:40px;padding-top:14px;border-top:1px solid var(--line);font-size:13.5px;color:var(--faint);display:flex;flex-direction:column;gap:4px}

@media (max-width:600px){
  h1{font-size:28px}
  .case{grid-template-columns:64px 1fr} .case img,.case .noimg{width:64px;height:64px}
  .four,.two{grid-template-columns:1fr}
  .topic{grid-template-columns:120px 1fr 30px}
  ul.obs li{grid-template-columns:1fr;gap:2px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>

<script>
"use strict";
const DATA = JSON.parse(document.getElementById("report-data").textContent);
const THEMES = {soft_baguette:"소프트 바게트", coffee_meal:"샌드위치+커피 식사", packaging:"포장", group_order:"단체주문"};
const REGION = {domestic:"국내", franchise:"프랜차이즈", overseas:"해외"};
const FORMAT = {photo:"사진", carousel:"캐러셀", reel:"릴스", video:"영상", text:"글", unknown:"형식 미확인"};
const INSIGHT = [["menuChanges","메뉴·재료 변화"],["contentMethods","참고할 콘텐츠 방식"],["franchiseLessons","프랜차이즈 캠페인에서 배울 점"],["overseasIdeas","해외 사례 중 시험해 볼 것"]];

function el(tag, attrs, ...kids){
  const e=document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})){ if (v==null||v===false) continue;
    if (k==="class") e.className=v; else if (k.startsWith("on")) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v===true?"":v); }
  for (const k of kids.flat(9)) if (k!=null&&k!==false) e.append(k.nodeType?k:String(k));
  return e;
}
const ymLabel = ym => { const [y,m]=ym.split("-"); return `${y}년 ${Number(m)}월`; };
const md = d => d ? d.slice(5).replace("-","/") : "날짜 미확인";

function refs(r, ids){
  const xs=(ids||[]).map(id=>r.refs[id]).filter(Boolean);
  if (!xs.length) return null;
  return el("p",{class:"src"}, "근거 ", xs.map((x,i)=>[i?" · ":"", link(x.url, `${x.brand} ${md(x.postedAt)}`)]));
}
function metrics(m){ if (!m) return null; const p=[]; if (typeof m.likes==="number") p.push("좋아요 "+m.likes.toLocaleString("ko-KR")); if (typeof m.comments==="number") p.push("댓글 "+m.comments.toLocaleString("ko-KR")); return p.join(" · ")||null; }

let cur = 0;
try{ const want=location.hash.slice(1); const i=DATA.months.findIndex(m=>m.ym===want); if (i>=0) cur=i; }catch{}

function render(){
  const app=document.getElementById("app");
  const r=DATA.months[cur];
  if (!r){ app.replaceChildren(el("p",{class:"muted"},"아직 공유된 보고서가 없습니다.")); return; }

      el("div",{style:"display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between"},

      el("div",{class:"meta"},
        el("span",{class:"chip "+(final?"basil":"crust")}, final?`확정본 v${r.version}`:`초안 v${r.version}`),
        el("span",{}, "관찰 기간 ", el("b",{class:"mono"},`${r.period?.from||""} ~ ${r.period?.to||""}`)),
        el("span",{}, "계정 ", el("b",{class:"mono"},s.accountsWithData??"–"), "곳 · 게시물 ", el("b",{class:"mono"},s.postsSelected??"–"), "건")),
      final ? null : el("p",{class:"note"}, "아직 확정 전인 초안입니다. 내용을 확인하는 중이라 일부 문장이 바뀔 수 있습니다."+(r.period?.partial?" 달이 끝나지 않아 월말까지의 게시물은 빠져 있습니다.":""))),
    el("nav",{class:"jump","aria-label":"바로가기"}, nav.map(([id,t])=>el("a",{href:"#"+id,onclick:e=>{e.preventDefault(); document.getElementById(id)?.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});}},t))),

    el("section",{id:"ideas"},
      el("h2",{},"타운샌드위치에서 해 볼 것"),
      el("p",{class:"lede"},"이번 달 관찰한 게시물을 근거로 한 제안입니다. 결과를 보장하지 않으며, 게시 후 적힌 지표로 확인합니다."),
      r.ideas.length ? el("div",{class:"ideas"}, r.ideas.map(i=>el("article",{class:"idea"},
        el("div",{class:"top"}, el("h3",{},i.title), i.theme&&THEMES[i.theme]? el("span",{class:"chip sky"},THEMES[i.theme]):null),
        el("p",{}, i.message||i.purpose||""),
        el("dl",{},
          i.target? [el("dt",{},"누구에게"), el("dd",{},i.target)] : null,
          i.scene||i.plan? [el("dt",{},"촬영 장면"), el("dd",{},i.scene||i.plan)] : null,
          (i.prep||[]).length? [el("dt",{},"준비물"), el("dd",{},i.prep.join(" · "))] : null,

          el("div",{}, el("p",{},o.text), refs(r, o.refs)))))); })),

    el("section",{id:"cases"},
      el("h2",{},`참고 사례 ${r.cases.length}건`),
      el("p",{class:"lede"},"자세히 뜯어본 게시물입니다. 공개 좋아요·댓글만 확인할 수 있어서 반응이 좋았다고 판단하지 않았습니다."),
      el("div",{class:"cases"}, r.cases.map(c=>el("article",{class:"case"},
        c.img ? el("img",{src:c.img,alt:`${c.brand} 게시물 이미지`,loading:"lazy"}) : el("div",{class:"noimg","aria-hidden":"true"}),
        el("div",{},
          el("div",{class:"head"}, el("span",{class:"b"},c.brand), el("span",{class:"chip"},REGION[c.category]||"참고"),

          el("p",{}, c.summary||""),
          metrics(c.metrics)? el("p",{class:"faint"}, "공개 수치 "+metrics(c.metrics)+(c.metricsAt?` (${md(c.metricsAt.slice(0,10))} 확인)`:"")) : null,
          c.analysis ? el("details",{}, el("summary",{},"분석 보기"),
            el("div",{class:"four"},
              el("div",{class:"fact"}, el("span",{class:"lb"},"확인한 사실"), c.analysis.facts||"–"),

      newsList("신제품·시즌 메뉴", r.launches),
      newsList("프로모션·이벤트", r.promos)),

    el("section",{id:"scope"},
      el("h2",{},"자료 범위"),
      topics(r.topicCounts),
      el("div",{class:"two"},
        el("div",{}, el("h3",{},"이번 자료의 한계"), el("ul",{}, [...(s.limits||[]), ...(r.insight.gaps||[])].map(t=>el("li",{},t)))),

    el("footer",{},

  );
}
function newsList(title, xs){
  if (!(xs||[]).length) return null;
  return [el("h3",{}, `${title} ${xs.length}건`),
    el("div",{class:"news"}, xs.slice().sort((a,b)=>(b.postedAt||"").localeCompare(a.postedAt||"")).map(x=>el("div",{class:"row"},

        el("p",{}, x.summary||"", " ", link(x.url,"원문"))))))];
}
function topics(tc){
  const e=Object.entries(tc||{}).sort((a,b)=>b[1]-a[1]); if (!e.length) return null;
  const max=Math.max(...e.map(x=>x[1]));
  return [el("h3",{},"주제 분포"), el("p",{class:"faint"},"관찰한 게시물 기준 · 한 게시물에 주제가 여러 개일 수 있음"),
    el("div",{class:"topics"}, e.map(([k,v])=>el("div",{class:"topic"}, el("span",{},k),
      el("span",{}, el("span",{class:"bar",style:`display:block;width:${Math.max(3,v/max*100)}%`})), el("span",{class:"n mono"},v))))];
}
